name: opencode2api
version: 1.2.0
description: "Runs the opencode2api relay (OpenCode Zen free models) as a child of the Hermes process — starts with Hermes, dies with Hermes, parks after 10 idle minutes; cron/kanban/send workers never own it."
author: bndae
kind: standalone
platforms:
  - linux
  - macos
  - windows
provides_hooks:
  - pre_api_request
license: MIT
homepage: https://github.com/6Kmfi6HP/opencode2api
requires_hermes: ">=0.22.0"
tags:
  - proxy
  - models
